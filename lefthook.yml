# EXAMPLE USAGE:
#
#   Refer for explanation to following link:
#   https://github.com/evilmartians/lefthook/blob/master/docs/configuration.md
#

pre-commit:
  commands:
    sync-dependencies:
      glob:
        - "package.json"
        - "packages/*/package.json"
        - "plugins/openclaw/n8n-as-code/package.json"
        - "scripts/sync-dependencies.mjs"
        - "scripts/check-version-consistency.js"
        - "scripts/release/workspace-release.mjs"
      run: node scripts/sync-dependencies.mjs --write --stage

    # Regenerate plugin SKILL.md files whenever ai-context-generator or the
    # build script itself is part of the commit. This prevents the CI check
    # "Verify committed skill not modified by build" from failing on every push
    # that touches the AI context generator.
    regen-skill-adapters:
      glob:
        - "packages/skills/src/services/ai-context-generator.ts"
        - "packages/skills/src/agent-skills/**"
        - "packages/skills/scripts/build-skill-adapters.js"
      # `set -e` is load-bearing. Without it this block reported success with a
      # failing `postbuild` and a failing generator — the commit went through
      # carrying stale SKILL.md files, which is exactly what the hook exists to
      # prevent. Verified both ways against a deliberately broken generator.
      run: |
        set -e
        npx tsc -b packages/skills
        npm run postbuild --workspace=packages/skills
        node packages/skills/scripts/build-skill-adapters.js
        git add skills/README.md \
                skills/n8n-architect/SKILL.md \
                plugins/claude/n8n-as-code/skills/n8n-architect/SKILL.md \
                plugins/openclaw/n8n-as-code/skills/n8n-architect/SKILL.md \
                plugins/cursor/n8n-as-code/skills/n8n-architect/SKILL.md

post-rewrite:
  commands:
    regen-skill-adapters-after-rewrite:
      run: npm run build:adapters:branch:stage --workspace=packages/skills
